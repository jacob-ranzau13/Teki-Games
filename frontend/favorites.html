<!DOCTYPE html>
<html>
<head>
  <title>Favorites</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="top-nav">
  <div class="nav-left">
    <button class="nav-icon" aria-hidden="true" title="Favorites">★</button>
    <div class="user-greeting">Favorites</div>
  </div>
  <div class="nav-right">
    <button class="nav-icon" title="Add Favorite" onclick="showAddForm()" aria-label="Add Favorite">★</button>
    <button class="nav-icon" title="Games" onclick="go('games.html')" aria-label="Games">🎮</button>
    <button class="nav-icon" title="Home" onclick="go('main.html')" aria-label="Home">⌂</button>
  </div>
</div>

<div class="games-wrap">
  <div id="add-form" class="register-modal hidden">
    <select id="favorite-game" class="tron-input"></select>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button onclick="addFavorite()" class="tron-button">Add Favorite</button>
      <button onclick="hideAddForm()" class="tron-button secondary">Cancel</button>
    </div>
    <div id="fav-error" style="color:#ff6b6b;margin-top:8px"></div>
  </div>

  <div id="favoritesList" class="game-grid" style="margin-top:12px"></div>
</div>

<script src="js/api.js"></script>
<script src="js/favorites.js"></script>
<script>
function go(page) { window.location = page; }
function logout() { localStorage.removeItem('user'); window.location = 'index.html'; }
</script>
</body>
</html>
