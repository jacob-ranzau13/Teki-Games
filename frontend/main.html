<!DOCTYPE html>
<html>
<head>
  <title>Teki-Games</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="top-nav">
  <div class="nav-left">
    <div class="user-greeting">Teki-Games: <span id="username">User</span></div>
  </div>
  <div class="nav-right">
    <button class="nav-icon" title="Games" onclick="go('games.html')" aria-label="Games">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 12v1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 12h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 12h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 6h8a2 2 0 0 1 2 2v6a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4V8a2 2 0 0 1 2-2z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="nav-icon" title="Reviews" onclick="go('reviews.html')" aria-label="Reviews">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="nav-icon" title="Favorites" onclick="go('favorites.html')" aria-label="Favorites">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M20.8 4.6a5 5 0 0 0-7.1 0L12 6.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21l8.8-9.3a5 5 0 0 0 0-7.1z" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="nav-icon" title="Platforms" onclick="go('platforms.html')" aria-label="Platforms">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2l8 4-8 4L4 6l8-4z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 10l8 4 8-4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16l8 4 8-4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="nav-icon" title="Stats" onclick="go('stats.html')" aria-label="Stats">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 3v18h18" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 17V9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 17V5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 17v-4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="nav-icon" title="Logout" onclick="logout()" aria-label="Logout">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M16 17l5-5-5-5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12H9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 19H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<div class="feed">
  <div class="post"><strong>News Feed:</strong> Welcome to Teki-Games!</div>
  <div class="post">Latest games and reviews will show up here.</div>
  <div class="post">You can click the icons above to navigate.</div>
</div>

<script>
function go(page) { window.location = page; }
function logout() {
  localStorage.removeItem("user");
  window.location = "index.html";
}

document.addEventListener('DOMContentLoaded', () => {
  try {
    const u = JSON.parse(localStorage.getItem('user'));
    if (u && u.username) document.getElementById('username').innerText = u.username;
  } catch(e) { console.error('Error parsing user data from localStorage', e); }
});
</script>
</body>
</html>
